# Large model profile for Puzzel
# 12-16 layers, d_model=768-1024

[model]
vocab_size = 2048
context_length = 1024
d_model = 768
num_layers = 12
num_heads = 12
num_kv_heads = 4
mlp_ratio = 4
use_rope = true
use_rmsnorm = true
use_swiglu = true
use_gqa = true
use_kv_cache = true
dropout = 0.1

[training]
batch_size = 4
learning_rate = 3e-4
warmup_steps = 500
max_steps = 50000
gradient_clip = 1.0
weight_decay = 0.01
lr_scheduler = "cosine"
seed = 42

[data]
target_vocab_size = 2048
min_frequency = 2
max_document_characters = 10000
train_fraction = 0.8
val_fraction = 0.1
test_fraction = 0.1
split_seed = 731