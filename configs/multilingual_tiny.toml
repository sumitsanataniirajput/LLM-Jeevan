# Separate multilingual CPU/FP32 pilot preset. This file does not prepare data or start training.
# Inspect resources with: ./scripts/hardware.sh --config configs/multilingual_tiny.toml

[tokenizer]
kind = "bpe"
vocab_size = 2048
min_frequency = 2

[model]
vocab_size = 2048
context_length = 128
d_model = 64
num_layers = 2
num_heads = 4
mlp_ratio = 4
dropout = 0.1
pad_token_id = 258
tie_embeddings = true

[training]
batch_size = 2
learning_rate = 0.0003
weight_decay = 0.1
max_steps = 1000
gradient_clip_norm = 1.0
seed = 1337
num_workers = 0
device = "cpu"
precision = "fp32"
log_every_steps = 10
save_every_steps = 100
scheduler = "cosine"
warmup_steps = 20
min_learning_rate = 0.00003
validation_every_steps = 100
validation_batches = 32
early_stopping_patience = 0
early_stopping_min_delta = 0.0
unstable_loss_threshold = 100.0
loss_spike_multiplier = 10.0

[training.language_sampling_weights]
en = 0.20
hi = 0.20
es = 0.15
fr = 0.15
ar = 0.15
zh = 0.15

[dataset]
validation_fraction = 0.1
test_fraction = 0.1
split_seed = 1337
max_document_characters = 1000000
jsonl_text_field = "text"
require_document_metadata = true
