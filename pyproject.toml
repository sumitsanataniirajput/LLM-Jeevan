[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "puzzel-llm"
version = "0.1.0"
description = "A from-scratch, modular PyTorch language-model starter (scratch track) with an optional Hugging Face fine-tuning track (hf)"
readme = "README.md"
requires-python = ">=3.11"
# Core runtime: architecture, tokenizer/data pipeline, and training loop.
# NumPy is included for PyTorch's tensor interoperability and ecosystem support.
dependencies = [
    "torch>=2.3.1,<3.0",
    "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
# REST API server.
serve = [
    "fastapi>=0.100,<1.0",
    "uvicorn>=0.27,<1.0",
]
# Hugging Face track (hf): base-model loading, LoRA SFT, datasets, distillation.
# Every Hugging Face import in puzzel is guarded so that `import puzzel` works
# without this extra installed.
hf = [
    "transformers>=4.46,<5.0",
    "peft>=0.13,<1.0",
    "accelerate>=1.0,<2.0",
    "datasets>=3.0,<4.0",
    "safetensors>=0.4,<1.0",
    "huggingface_hub>=0.24,<1.0",
    "sentencepiece>=0.2,<1.0",
    "trl>=0.11,<1.0",
]
dev = [
    "pytest>=8.0,<10.0",
    "ruff>=0.6,<1.0",
    # fastapi.testclient (used by tests/test_inference.py) requires httpx.
    "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["puzzel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
