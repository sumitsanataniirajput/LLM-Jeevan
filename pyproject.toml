[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "puzzel-llm"
version = "0.1.0"
description = "A from-scratch, modular PyTorch language-model starter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.3.1,<3.0", "numpy>=1.26,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["puzzel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
